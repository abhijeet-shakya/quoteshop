<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storefront – mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
[data-theme="light"]{--bg:#FFFFFF;--surface:#FFFFFF;--panel:var(--panel);--field:var(--field);--tile:var(--tile);--tile-2:#ECEAE4;--tile-3:#E8E4DC;--tile-4:#E3E8E2;--line:var(--line);--border:var(--border);--text:#121413;--muted:#5E625F;--ink-bg:#121413;--sel-bg:#121413;--sel-fg:#FFFFFF;--glass:var(--glass);--dot:#B9BCB8;--ph:#6B6F6C}
[data-theme="dark"]{--bg:#0E100F;--surface:#171A18;--panel:#1A1D1B;--field:#1F2321;--tile:#1C201E;--tile-2:#222624;--tile-3:#262A28;--tile-4:#1E2422;--line:#262A28;--border:#343936;--text:#EEF0EC;--muted:#A3AAA5;--ink-bg:#2C312E;--sel-bg:#EEF0EC;--sel-fg:#121413;--glass:rgba(14,16,15,0.88);--dot:#5A605C;--ph:#8A918C}
[data-theme] a{color:var(--text)}
[data-theme] input,[data-theme] textarea{color:var(--text);background-color:var(--surface)}
[data-theme] input::placeholder,[data-theme] textarea::placeholder{color:var(--ph)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; background: var(--bg); color-scheme: {{theme}}; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif; color: var(--text); display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="flex: 1; overflow-y: auto; padding-bottom: 150px">
    <header style="padding: 14px 20px 8px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 36px; height: 36px; border-radius: 11px; background: var(--ink-bg); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">JBB</span>
          <span style="font-weight: 750; font-size: 16px; letter-spacing: -0.02em">Jai Balaji Billiards</span>
        </div>
        <div style="display: flex; gap: 8px"><button type="button" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--field); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center"><sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if><sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if></button><a href="#" aria-label="Chat on WhatsApp" style="width: 44px; height: 44px; border-radius: 999px; background: var(--field); display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"></path></svg>
        </a></div>
      </div>
      <h1 style="margin: 0; font-size: 22px; line-height: 1.15; letter-spacing: -0.03em; font-weight: 800">Best price on WhatsApp</h1>
    </header>

    <div style="position: sticky; top: 0; z-index: 4; background: var(--glass); backdrop-filter: blur(14px); padding: 10px 0 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 0 var(--line)">
      <div style="margin: 0 20px; display: flex; align-items: center; gap: 10px; background: var(--field); border-radius: 999px; padding: 0 16px; height: 46px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E625F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <label for="ms" style="position: absolute; left: -9999px">Search products</label>
        <input id="ms" type="search" placeholder="Search products" value="{{q}}" onChange="{{onSearch}}" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 15px; background: transparent; height: 44px">
      </div>
      <div style="display: flex; gap: 8px; overflow-x: auto; padding: 0 20px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
          <button type="button" onClick="{{c.pick}}" style="flex: none; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; white-space: nowrap">{{c.name}}</button>
        </sc-for>
      </div>
    </div>

    <a href="#" style="margin: 12px 20px 16px; min-height: 44px; padding: 10px 14px; box-sizing: border-box; border-radius: 14px; background: {{accentSoft}}; color: {{accentInk}}; text-decoration: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 700">
      <span>Buying 5+ pcs? You get trade rates</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; padding: 0 20px">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="6">
        <article style="display: flex; flex-direction: column; gap: 8px">
          <div style="position: relative; aspect-ratio: 1 / 1; border-radius: 20px; background: var(--tile); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; outline: 2px solid {{p.ring}}; outline-offset: -2px">
            <sc-if value="{{p.isTable}}" hint-placeholder-val="{{ true }}">
              <svg viewBox="0 0 200 112" width="100%" aria-hidden="true"><rect x="0" y="0" width="200" height="112" rx="12" fill="{{p.wood}}"></rect><rect x="12" y="12" width="176" height="88" rx="4" fill="{{p.cloth}}"></rect><circle cx="14" cy="14" r="6" fill="#0A0A0A"></circle><circle cx="186" cy="14" r="6" fill="#0A0A0A"></circle><circle cx="14" cy="98" r="6" fill="#0A0A0A"></circle><circle cx="186" cy="98" r="6" fill="#0A0A0A"></circle></svg>
            </sc-if>
            <sc-if value="{{p.isCue}}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 200 112" width="100%" aria-hidden="true"><line x1="16" y1="96" x2="184" y2="16" stroke="#3B2414" stroke-width="8" stroke-linecap="round"></line><line x1="110" y1="51" x2="184" y2="16" stroke="#D8BF8C" stroke-width="5" stroke-linecap="round"></line></svg>
            </sc-if>
            <sc-if value="{{p.isBalls}}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 200 112" width="80%" aria-hidden="true"><circle cx="70" cy="56" r="14" fill="#D64532"></circle><circle cx="96" cy="41" r="14" fill="#E3B23C"></circle><circle cx="96" cy="71" r="14" fill="#2F5FC4"></circle><circle cx="122" cy="26" r="14" fill="#151515"></circle><circle cx="122" cy="56" r="14" fill="#7A3BA8"></circle><circle cx="122" cy="86" r="14" fill="#E9852B"></circle></svg>
            </sc-if>
            <sc-if value="{{p.notInCart}}" hint-placeholder-val="{{ true }}">
              <button type="button" aria-label="Add to quote" onClick="{{p.add}}" style="position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--surface); box-shadow: 0 4px 14px rgba(18,20,19,0.14); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
            </sc-if>
            <sc-if value="{{p.inCart}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 44px; border-radius: 999px; background: var(--ink-bg); color: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
                <button type="button" aria-label="Decrease quantity" onClick="{{p.dec}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; font: inherit; font-size: 18px; cursor: pointer">−</button>
                <span style="font-weight: 800; font-size: 14px">{{p.qty}}</span>
                <button type="button" aria-label="Increase quantity" onClick="{{p.inc}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; font: inherit; font-size: 18px; cursor: pointer">+</button>
              </div>
            </sc-if>
          </div>
          <div style="padding: 0 2px">
            <a href="MobileItem.dc.html" style="display: block; font-size: 14px; font-weight: 700; line-height: 1.3; text-decoration: none">{{p.name}}</a>
            <div style="font-size: 15px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px">{{p.priceText}}</div>
            <div style="font-size: 11px; color: var(--muted); margin-top: 1px">{{p.priceSub}}</div>
          </div>
        </article>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{hasCart}}" hint-placeholder-val="{{ true }}">
    <a href="MobileQuote.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 92px; height: 56px; border-radius: 999px; background: var(--ink-bg); color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; box-shadow: 0 12px 30px rgba(18,20,19,0.28)">
      <span style="font-size: 14px"><strong>{{count}} products</strong> · {{units}} pcs</span>
      <span style="height: 42px; padding: 0 16px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; font-weight: 750; font-size: 14px">Get price</span>
    </a>
  </sc-if>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--glass); backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 14px">
    <a href="Mobile.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 700; color: var(--text)">
      <span style="width: 52px; height: 30px; border-radius: 999px; background: {{accentSoft}}; color: {{accentInk}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></span>Home
    </a>
    <a href="Main.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted)">
      <span style="height: 30px; display: flex; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg></span>Browse
    </a>
    <a href="MobileQuote.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted)">
      <span style="height: 30px; display: flex; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l1 3H8z"></path><rect x="5" y="7" width="14" height="14" rx="2"></rect><path d="M9 12h6M9 16h4"></path></svg></span>Quotes
    </a>
    <a href="MobileOrders.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted)">
      <span style="height: 30px; display: flex; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></span>Account
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"showPrices":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#146B47","options":["#146B47","#2F5FC4","#B4372A","#121413"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cart: { m1: 2, m4: 20 }, cat: 'All', q: '' };
  }
  soft(hex, dark) {
    const light = { '#146B47': ['#E4F1EA', '#0E5236'], '#2F5FC4': ['#E6EDFB', '#1E438F'], '#B4372A': ['#F8E7E4', '#8A2A20'], '#121413': ['#F0F0EC', '#121413'] };
    const darkMap = { '#146B47': ['#173A2C', '#8FDDB8'], '#2F5FC4': ['#1C2B4A', '#A9C2F5'], '#B4372A': ['#3D211D', '#F2A79C'], '#121413': ['#2C312E', '#EEF0EC'] };
    const m = dark ? darkMap : light;
    return m[hex] || (dark ? ['#2C312E', '#EEF0EC'] : ['#F0F0EC', '#121413']);
  }
  setQty(id, qty) {
    const cart = Object.assign({}, this.state.cart);
    if (qty > 0) { cart[id] = qty; } else { delete cart[id]; }
    this.setState({ cart: cart });
  }
  renderVals() {
    const accent = this.props.accent ?? '#146B47';
    const dark = this.state.dark !== undefined ? this.state.dark : (this.props.dark ?? false);
    const soft = this.soft(accent, dark);
    const showPrices = this.props.showPrices ?? true;
    const products = [
      { id: 'm1', name: 'Gold JBB Championship Pool Table', cat: 'Tables', kind: 'table', moq: 1, step: 1, unit: 'pc', cloth: '#146B47', wood: '#6E4729' },
      { id: 'm2', name: 'JBB Wooden Snooker Table', cat: 'Tables', kind: 'table', moq: 1, step: 1, unit: 'pc', cloth: '#0F5A3B', wood: '#5B3A22' },
      { id: 'm3', name: 'Mini Snooker Table', cat: 'Tables', kind: 'table', moq: 1, step: 1, unit: 'pc', cloth: '#2F5FC4', wood: '#7A5232' },
      { id: 'm4', name: '57" Omin Victory Snooker Cue', cat: 'Cues', kind: 'cue', moq: 1, step: 1, unit: 'pcs' },
      { id: 'm5', name: 'JBB Aluminium Cue Case', cat: 'Cues', kind: 'cue', moq: 1, step: 1, unit: 'pcs' },
      { id: 'm6', name: 'Pool Table Accessories Set', cat: 'Accessories', kind: 'balls', moq: 1, step: 1, unit: 'sets' }
    ];
    const cart = this.state.cart;
    const sel = this.state.cat;
    const q = (this.state.q || '').toLowerCase();
    const prices = { m2: '₹1,55,000', m6: '₹4,499' };
    const items = products.filter((p) => (sel === 'All' || p.cat === sel) && (!q || p.name.toLowerCase().indexOf(q) >= 0)).map((p) => {
      const qty = cart[p.id] || 0;
      const per = p.unit === 'sets' ? 'set' : 'pc';
      return Object.assign({}, p, {
        priceText: showPrices ? 'From ' + (prices[p.id] || '₹[PRICE]') : 'Price on request',
        priceSub: showPrices ? 'per ' + per + ' · less for bulk' : 'Best price on WhatsApp',
        qty: qty,
        inCart: qty > 0,
        notInCart: qty === 0,
        ring: qty > 0 ? accent : 'transparent',
        isTable: p.kind === 'table',
        isCue: p.kind === 'cue',
        isBalls: p.kind === 'balls',
        add: () => this.setQty(p.id, p.moq),
        inc: () => this.setQty(p.id, qty + p.step),
        dec: () => this.setQty(p.id, qty - p.step < p.moq ? 0 : qty - p.step)
      });
    });
    const cats = ['All', 'Tables', 'Cues', 'Accessories', 'Table Games'].map((name) => {
      const on = name === sel;
      return { name: name, border: on ? 'var(--sel-bg)' : 'var(--border)', bg: on ? 'var(--sel-bg)' : 'var(--surface)', color: on ? 'var(--sel-fg)' : 'var(--text)', pick: () => this.setState({ cat: name }) };
    });
    const ids = Object.keys(cart);
    let units = 0;
    ids.forEach((k) => { units += cart[k]; });
    return {
      theme: dark ? 'dark' : 'light',
      isDark: dark,
      isLight: !dark,
      themeLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.setState({ dark: !dark }),
      accent: accent,
      accentSoft: soft[0],
      accentInk: soft[1],
      items: items,
      cats: cats,
      q: this.state.q,
      onSearch: (e) => this.setState({ q: e.target.value }),
      count: ids.length,
      units: units,
      hasCart: ids.length > 0
    };
  }
}
</script>
</body>
</html>

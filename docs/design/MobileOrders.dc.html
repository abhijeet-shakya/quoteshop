<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storefront – my orders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
[data-theme="light"]{--bg:#FFFFFF;--surface:#FFFFFF;--panel:#F7F7F4;--field:#F4F4F1;--tile:#F1F1EE;--line:#ECECE8;--border:#E2E2DE;--text:#121413;--muted:#5E625F;--ink-bg:#121413;--sel-bg:#121413;--sel-fg:#FFFFFF;--glass:rgba(255,255,255,0.9);--warn-bg:#FBF1DC;--warn-fg:#7A5300}
[data-theme="dark"]{--bg:#0E100F;--surface:#171A18;--panel:#1A1D1B;--field:#1F2321;--tile:#1C201E;--line:#262A28;--border:#343936;--text:#EEF0EC;--muted:#A3AAA5;--ink-bg:#2C312E;--sel-bg:#EEF0EC;--sel-fg:#121413;--glass:rgba(14,16,15,0.88);--warn-bg:#3A2E14;--warn-fg:#F2CF7E}
[data-theme] a{color:var(--text)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; background: var(--bg); color-scheme: {{theme}}; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif; color: var(--text); display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="flex: none; padding: 16px 20px 12px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid var(--line)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div>
        <div style="font-size: 13px; color: var(--muted)">Hi, [BUYER NAME]</div>
        <h1 style="margin: 2px 0 0; font-size: 24px; letter-spacing: -0.035em; font-weight: 800">My account</h1>
      </div>
      <a href="#" aria-label="Chat on WhatsApp" style="width: 44px; height: 44px; border-radius: 999px; background: var(--field); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"></path></svg>
      </a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: var(--field)">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button type="button" onClick="{{t.pick}}" style="height: 40px; border-radius: 999px; border: 0; background: {{t.bg}}; color: {{t.color}}; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 12px">

    <sc-if value="{{onOrders}}" hint-placeholder-val="{{ true }}">
      <div style="border-radius: 20px; background: {{accentSoft}}; color: {{accentInk}}; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
        <div>
          <div style="font-size: 12px; font-weight: 700">Saved vs listed prices</div>
          <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.03em; margin-top: 2px">{{totalSaved}}</div>
        </div>
        <div style="font-size: 12px; text-align: right; font-weight: 600">across {{orderCount}} orders</div>
      </div>

      <sc-for list="{{orders}}" as="o" hint-placeholder-count="2">
        <article style="border-radius: 20px; border: 1px solid var(--line); background: var(--surface); overflow: hidden">
          <button type="button" onClick="{{o.toggle}}" style="width: 100%; border: 0; background: transparent; color: var(--text); font: inherit; text-align: left; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <span style="font-weight: 800; font-size: 15px">{{o.id}}</span>
              <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: {{o.statusBg}}; color: {{o.statusFg}}; display: flex; align-items: center; font-size: 12px; font-weight: 700">{{o.status}}</span>
            </div>
            <div style="font-size: 13px; color: var(--muted)">{{o.date}} · {{o.lineCount}} items · {{o.units}} pcs</div>
            <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 8px">
              <div>
                <div style="font-size: 12px; color: var(--muted)">Your price</div>
                <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.03em">{{o.sold}}</div>
              </div>
              <div style="text-align: right">
                <div style="font-size: 12px; color: var(--muted); text-decoration: line-through">{{o.listed}}</div>
                <div style="font-size: 13px; font-weight: 800; color: {{accentText}}">You saved {{o.saved}} ({{o.pct}})</div>
              </div>
            </div>
          </button>
          <sc-if value="{{o.open}}" hint-placeholder-val="{{ false }}">
            <div style="border-top: 1px solid var(--line); padding: 4px 16px 14px">
              <sc-for list="{{o.lines}}" as="l" hint-placeholder-count="2">
                <div style="padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px">
                  <div style="font-size: 14px; font-weight: 700">{{l.name}}</div>
                  <div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--muted)">
                    <span>{{l.qty}} × <span style="text-decoration: line-through">{{l.listed}}</span></span>
                    <span style="color: var(--text); font-weight: 750">{{l.sold}} each</span>
                  </div>
                </div>
              </sc-for>
              <div style="display: flex; gap: 8px; margin-top: 12px">
                <a href="MobileQuote.dc.html" style="flex: 1; height: 46px; border-radius: 999px; background: var(--ink-bg); color: #FFFFFF; text-decoration: none; font-weight: 750; font-size: 14px; display: flex; align-items: center; justify-content: center">Reorder</a>
                <a href="#" style="flex: 1; height: 46px; border-radius: 999px; border: 1px solid var(--border); text-decoration: none; font-weight: 650; font-size: 14px; display: flex; align-items: center; justify-content: center">Order PDF</a>
              </div>
            </div>
          </sc-if>
        </article>
      </sc-for>
    </sc-if>

    <sc-if value="{{onRequests}}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{requests}}" as="r" hint-placeholder-count="3">
        <article style="border-radius: 20px; border: 1px solid var(--line); background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-weight: 800; font-size: 15px">{{r.id}}</span>
            <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: {{r.statusBg}}; color: {{r.statusFg}}; display: flex; align-items: center; font-size: 12px; font-weight: 700">{{r.status}}</span>
          </div>
          <div style="font-size: 13px; color: var(--muted)">{{r.date}} · {{r.summary}}</div>
          <div style="font-size: 13px">{{r.note}}</div>
          <sc-if value="{{r.priced}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; gap: 8px; margin-top: 4px">
              <a href="MobileQuoteDetail.dc.html" style="flex: 1; height: 44px; border-radius: 999px; background: var(--ink-bg); color: #FFFFFF; text-decoration: none; font-weight: 750; font-size: 14px; display: flex; align-items: center; justify-content: center">View price</a>
              <a href="#" style="flex: 1; height: 44px; border-radius: 999px; border: 1px solid var(--border); text-decoration: none; font-weight: 650; font-size: 14px; display: flex; align-items: center; justify-content: center">Reply on WhatsApp</a>
            </div>
          </sc-if>
        </article>
      </sc-for>
    </sc-if>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--glass); backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 14px">
    <a href="Mobile.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted)">
      <span style="height: 30px; display: flex; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></span>Home
    </a>
    <a href="Mobile.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted)">
      <span style="height: 30px; display: flex; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg></span>Browse
    </a>
    <a href="MobileQuote.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted)">
      <span style="height: 30px; display: flex; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l1 3H8z"></path><rect x="5" y="7" width="14" height="14" rx="2"></rect><path d="M9 12h6M9 16h4"></path></svg></span>Quotes
    </a>
    <a href="MobileOrders.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 700; color: var(--text)">
      <span style="width: 52px; height: 30px; border-radius: 999px; background: {{accentSoft}}; color: {{accentInk}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></span>Account
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#146B47","options":["#146B47","#2F5FC4","#B4372A","#121413"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'orders', open: { 'SO-0012': true } };
  }
  soft(hex, dark) {
    const light = { '#146B47': ['#E4F1EA', '#0E5236'], '#2F5FC4': ['#E6EDFB', '#1E438F'], '#B4372A': ['#F8E7E4', '#8A2A20'], '#121413': ['#F0F0EC', '#121413'] };
    const darkMap = { '#146B47': ['#173A2C', '#8FDDB8'], '#2F5FC4': ['#1C2B4A', '#A9C2F5'], '#B4372A': ['#3D211D', '#F2A79C'], '#121413': ['#2C312E', '#EEF0EC'] };
    const m = dark ? darkMap : light;
    return m[hex] || (dark ? ['#2C312E', '#EEF0EC'] : ['#F0F0EC', '#121413']);
  }
  inr(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }
  renderVals() {
    const accent = this.props.accent ?? '#146B47';
    const dark = this.props.dark ?? false;
    const soft = this.soft(accent, dark);
    const tab = this.state.tab;
    const raw = [
      { id: 'SO-0012', date: '12 Sep 2026', status: 'Confirmed', lines: [
        { name: 'JBB Wooden Snooker Table 6×12', qty: 4, listed: 155000, sold: 142000 },
        { name: 'Pool Table Accessories Set', qty: 10, listed: 4499, sold: 3900 }
      ] },
      { id: 'SO-0007', date: '28 Jul 2026', status: 'Completed', lines: [
        { name: '57" Omin Victory Snooker Cue', qty: 20, listed: 0, sold: 0 }
      ] }
    ];
    let allSaved = 0;
    const orders = raw.map((o) => {
      let listed = 0;
      let sold = 0;
      let units = 0;
      const known = o.lines.every((l) => l.listed > 0);
      const lines = o.lines.map((l) => {
        listed += l.listed * l.qty;
        sold += l.sold * l.qty;
        units += l.qty;
        return { name: l.name, qty: l.qty, listed: l.listed ? this.inr(l.listed) : '₹[LISTED]', sold: l.sold ? this.inr(l.sold) : '₹[SOLD]' };
      });
      const saved = listed - sold;
      if (known) { allSaved += saved; }
      const open = !!this.state.open[o.id];
      const done = o.status === 'Completed';
      return {
        id: o.id,
        date: o.date,
        status: o.status,
        statusBg: done ? 'var(--field)' : soft[0],
        statusFg: done ? 'var(--muted)' : soft[1],
        lineCount: o.lines.length,
        units: units,
        lines: lines,
        sold: known ? this.inr(sold) : '₹[SOLD]',
        listed: known ? this.inr(listed) : '₹[LISTED]',
        saved: known ? this.inr(saved) : '₹[SAVED]',
        pct: known ? (Math.round((saved / listed) * 1000) / 10) + '%' : '[%]',
        open: open,
        toggle: () => {
          const next = Object.assign({}, this.state.open);
          next[o.id] = !open;
          this.setState({ open: next });
        }
      };
    });
    const reqRaw = [
      { id: 'RFQ-0019', date: '2 Oct 2026', summary: '3 items · 26 pcs', status: 'Price sent', note: 'Your price is ready. Valid till [DATE].', priced: true },
      { id: 'RFQ-0021', date: '3 Oct 2026', summary: '1 item · 2 pcs', status: 'Waiting for price', note: 'Our team will WhatsApp you within [RESPONSE TIME].', priced: false },
      { id: 'RFQ-0015', date: '10 Sep 2026', summary: '2 items · 14 pcs', status: 'Ordered', note: 'Became order SO-0012.', priced: false }
    ];
    const requests = reqRaw.map((r) => {
      const waiting = r.status === 'Waiting for price';
      const sent = r.status === 'Price sent';
      return Object.assign({}, r, {
        statusBg: waiting ? 'var(--warn-bg)' : (sent ? soft[0] : 'var(--field)'),
        statusFg: waiting ? 'var(--warn-fg)' : (sent ? soft[1] : 'var(--muted)')
      });
    });
    const tabs = [{ id: 'orders', label: 'Orders' }, { id: 'requests', label: 'Requests' }].map((t) => {
      const on = t.id === tab;
      return { label: t.label, bg: on ? 'var(--surface)' : 'transparent', color: on ? 'var(--text)' : 'var(--muted)', pick: () => this.setState({ tab: t.id }) };
    });
    return {
      theme: dark ? 'dark' : 'light',
      accent: accent,
      accentSoft: soft[0],
      accentInk: soft[1],
      accentText: dark ? soft[1] : accent,
      tabs: tabs,
      onOrders: tab === 'orders',
      onRequests: tab === 'requests',
      orders: orders,
      orderCount: orders.length,
      totalSaved: this.inr(allSaved),
      requests: requests
    };
  }
}
</script>
</body>
</html>

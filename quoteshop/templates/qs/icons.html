{%- macro icon(name, size=20, stroke="2", color="currentColor") -%}
<svg width="{{ size|e }}" height="{{ size|e }}" viewBox="0 0 24 24" fill="none" stroke="{{ color|e }}" stroke-width="{{ stroke|e }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "whatsapp" -%}<path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"></path>
{%- elif name == "sun" -%}<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
{%- elif name == "moon" -%}<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
{%- elif name == "search" -%}<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
{%- elif name == "plus" -%}<path d="M12 5v14M5 12h14"></path>
{%- elif name == "home" -%}<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path>
{%- elif name == "browse" -%}<rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect>
{%- elif name == "quote" -%}<path d="M9 4h6l1 3H8z"></path><rect x="5" y="7" width="14" height="14" rx="2"></rect><path d="M9 12h6M9 16h4"></path>
{%- elif name == "account" -%}<circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path>
{%- elif name == "back" -%}<path d="M15 18l-6-6 6-6"></path>
{%- elif name == "chevron" -%}<path d="M9 6l6 6-6 6"></path>
{%- elif name == "photo" -%}<rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 8"></path>
{%- endif -%}
</svg>
{%- endmacro -%}

{%- macro theme_toggle(qs, cls) -%}
{%- if qs.allow_switch -%}
<button type="button" class="{{ cls|e }}" data-qs-theme-toggle aria-label="{{ _('Switch to dark mode')|e }}"><span class="qs-i-sun">{{ icon("sun") }}</span><span class="qs-i-moon">{{ icon("moon") }}</span></button>
{%- endif -%}
{%- endmacro -%}

{%- macro img(photo, sizes, width=400, height=400, priority=False, cls="") -%}
<img{% if cls %} class="{{ cls|e }}"{% endif %} src="{{ (photo.medium if priority else photo.thumb)|e }}"
{%- if photo.thumb != photo.large %} srcset="{{ photo.thumb|replace(" ", "%20")|e }} 400w, {{ photo.medium|replace(" ", "%20")|e }} 1000w, {{ photo.large|replace(" ", "%20")|e }} 1800w" sizes="{{ sizes|e }}"{% endif %} alt="{{ photo.alt|e }}" width="{{ width|e }}" height="{{ height|e }}" decoding="async"
{%- if priority %} fetchpriority="high"{% else %} loading="lazy"{% endif %}>
{%- endmacro -%}
